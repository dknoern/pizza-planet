version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9
        - pnpm install --frozen-lockfile
        - pnpm prisma generate
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "SESSION_SECRET="change-me-to-32-plus-random-chars-or-the-app-will-refuse-to-boot"
        - echo "PAYMENT_SIM_MODE="simulator" >> .env
        - echo "GUEST_TOKEN_SECRET="change-me-too-32-plus-random-chars" >> .env
        - echo "NODE_ENV=production" >> .env
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
