version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9
        - pnpm install --frozen-lockfile --prod=false
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - echo "SESSION_SECRET=$SESSION_SECRET" >> .env
        - echo "PAYMENT_SIM_MODE=$PAYMENT_SIM_MODE" >> .env
        - echo "GUEST_TOKEN_SECRET=$GUEST_TOKEN_SECRET" >> .env
        - echo "NODE_ENV=$NODE_ENV" >> .env
        - echo "LWA_CLIENT_ID=$LWA_CLIENT_ID" >> .env
        - echo "LWA_CLIENT_SECRET=$LWA_CLIENT_SECRET" >> .env
        - echo "LWA_REDIRECT_URI=$LWA_REDIRECT_URI" >> .env
        - echo "LWA_COOKIE_SECRET=$LWA_COOKIE_SECRET" >> .env
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
